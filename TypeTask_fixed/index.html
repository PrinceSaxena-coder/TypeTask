<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TypeTask - A Typre-Safe Task Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class = "site-header">
    <div class ="brand">
      <span class="brand-dot" aria hidden="true"></span>
      <h1 class ="brand-name">TypeTasks</h1>
    </div>
    <p class ="tagline">A type-safe task tracker - built on a TypeScript data model.</p>
    <p id="summary" class="summary"></p>
  </header>
    <!-- index.html -->
<main class="container">
  <div class="addrow">
    <input id="title" type="text" class ="add-input" placeholder="Add a task…(e.g. Write the Task interface)" autocomplete="off" />
    <select id="status" class ="add-status" aria-label="Initial status">
      <option value="todo">todo</option>
      <option value="in-progress">in-progress</option>
      <option value="done">done</option>
    </select>
    <button id="add" type="button" class="add-btn">Add task</button>
  </div>
  <div id="chips" class="chips" role="group" aria-label="Filter by status"></div>
  <ul id="list" class="list" aria-label="Tasks"></ul>
</div>
</main>

<footer class="site-footer">
  <p>Built with plain HTML,CSS &amp; TypeScript. Every task obeys the <code>Task</code> type.</p>
</footer>

<!-- load the COMPILED js, as a module so it can import model.js -->
<script type="module" src="app.js"></script>
</body>
</html>
